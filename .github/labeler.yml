# PR auto-labeling rules.
#
# Applied by .github/workflows/label-pr.yml using actions/labeler.
# Labels referenced here must exist — run `uv run poe gh-labels` to create them.
# The `dependencies` label is also created by the bootstrap script so this
# file works on a fresh repo with no manual label setup.
#
# Scopes below map file paths to the standard taxonomy:
#   area:*   — which part of the project the change touches
#   type:*   — left to issue templates (NOT auto-applied on PRs)

"area:engineering":
  - changed-files:
    - any-glob-to-any-file:
      - ".github/**"
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
      - "uv.lock"

"area:docs":
  - changed-files:
    - any-glob-to-any-file:
      - "docs/**"
      - "mkdocs.yml"
      - "*.md"

"area:testing":
  - changed-files:
    - any-glob-to-any-file: "tests/**"

# One area per public module; the private code lives in src/geophysix/_src/<module>/.
"area:constants":
  - changed-files:
    - any-glob-to-any-file:
      - "src/geophysix/constants.py"
      - "src/geophysix/_src/constants/**"

"area:earth":
  - changed-files:
    - any-glob-to-any-file:
      - "src/geophysix/earth.py"
      - "src/geophysix/_src/earth/**"

"area:rotation":
  - changed-files:
    - any-glob-to-any-file:
      - "src/geophysix/rotation.py"
      - "src/geophysix/_src/rotation/**"

"area:thermo":
  - changed-files:
    - any-glob-to-any-file:
      - "src/geophysix/thermo.py"
      - "src/geophysix/_src/thermo/**"

"area:seawater":
  - changed-files:
    - any-glob-to-any-file:
      - "src/geophysix/seawater.py"
      - "src/geophysix/_src/seawater/**"

"area:columns":
  - changed-files:
    - any-glob-to-any-file:
      - "src/geophysix/columns.py"
      - "src/geophysix/_src/columns/**"

# --- Default / legacy labels retained for Dependabot compatibility ---------

"dependencies":
  - changed-files:
    - any-glob-to-any-file:
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
      - "uv.lock"
