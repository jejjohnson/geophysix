name: Tests

on:
  push:
    branches: [main]
  # every pull request, whatever its base, so stacked PRs are tested too
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --all-extras --all-groups
      - name: Run tests with coverage
        run: uv run pytest -v
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  test-without-jax:
    name: geophysix without JAX and xarray
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install dependencies (no extras)
        run: uv sync --group dev --group test
      - name: Assert that JAX and xarray are not installed
        run: >-
          uv run python -c
          "import importlib.util as u, sys; sys.exit(any(map(u.find_spec, ('jax', 'xarray'))))"
      - name: Run the tests without them
        run: uv run pytest -o addopts= tests

  test-torch:
    name: geophysix on torch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      # torch is large, so it is in no dependency group. 2.10 is pinned because
      # its asarray detaches a tensor; 2.13 no longer does.
      - name: Install the package with JAX, the test libraries and CPU torch
        run: |
          uv sync --all-extras --group dev --group test
          uv pip install "torch==2.10.*" --index-url https://download.pytorch.org/whl/cpu
      - name: Run every public function on torch
        run: uv run --no-sync pytest -o addopts= tests/test_array_kinds.py
